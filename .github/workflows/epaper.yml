name: Daily Odia E-Paper Downloader

on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "30 3 * * *"
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epaper-daily
  cancel-in-progress: false

jobs:
  run-scraper:
    timeout-minutes: 45
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Scraper Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: python -u main.py

      - name: Persist delivery state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No delivery-state changes to commit."
            exit 0
          fi
          edition_date="$(python - <<'PY'
          import json

          with open("state.json", encoding="utf-8") as f:
              state = json.load(f)

          dates = [key.split(":", 1)[1] for key in state.get("sent", {}) if ":" in key]
          print(max(dates) if dates else "unknown")
          PY
          )"

          delivery_summary="$(python - <<'PY'
          import json

          with open("state.json", encoding="utf-8") as f:
              state = json.load(f)

          items = []
          for key, info in state.get("sent", {}).items():
              if ":" not in key:
                  continue
              newspaper, date = key.split(":", 1)
              items.append((date, newspaper, info.get("size_mb")))

          for date, newspaper, size_mb in sorted(items, reverse=True):
              size = f" — {size_mb:.2f} MB" if isinstance(size_mb, (int, float)) else ""
              print(f"- {newspaper.title()}: {date}{size}")
          PY
          )"

          commit_title="chore: update daily newspaper delivery state — ${edition_date}"
          commit_body="$(cat <<EOF
          📰 Daily Odisha E-Paper Delivery

          📅 Latest edition: ${edition_date}

          ✅ Successfully delivered:
          ${delivery_summary}

          📦 Delivery state updated
          🔐 SHA-256 hashes recorded
          🔄 Duplicate tracking refreshed

          🤖 Automated by GitHub Actions
          EOF
          )"

          git commit -m "$commit_title" -m "$commit_body"
          git push
